buildscript {
  ext.getExtOrDefault = {name ->
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties['MapsforgeVtmExtPathColorRamp_' + name]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.12.0"
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}

// ── Declare vtm classes that this extension shadows ─────────────────────
// Read by strip-vtm-classes.gradle to resolve DEX duplicates.
// Format: fully-qualified class names (inner classes are handled automatically).
ext.shadowedClasses = [
    'org.oscim.renderer.bucket.LineBucket',
    'org.oscim.renderer.bucket.RenderBuckets',
]

apply plugin: "com.android.library"
apply plugin: "kotlin-android"
apply plugin: "com.facebook.react"

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["MapsforgeVtmExtPathColorRamp_" + name]).toInteger()
}

def supportsNamespace() {
  def parsed = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')
  def major = parsed[0].toInteger()
  def minor = parsed[1].toInteger()
  return (major == 7 && minor >= 3) || major >= 8
}

android {
  if (supportsNamespace()) {
    namespace "com.jhotadhari.reactnative.mapsforge.vtm.ext.pathcolorramp"

    sourceSets {
      main {
        manifest.srcFile "src/main/AndroidManifestNew.xml"
      }
    }
  }

  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
  }

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  sourceSets {
    main {
      java.srcDirs += [
        "generated/java",
        "generated/jni"
      ]
    }
  }
}

repositories {
  mavenCentral()
  google()
}

def kotlin_version = getExtOrDefault("kotlinVersion")

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

  // react-native-mapsforge-vtm (peer dependency — provides vtm transitively)
  implementation project(':react-native-mapsforge-vtm')

  // vtm — same versions as core library; compileOnly to avoid dex duplicates
  // (provided at runtime by react-native-mapsforge-vtm)
  compileOnly 'com.github.mapsforge.vtm:vtm:0.29.0'
  compileOnly 'com.github.mapsforge.vtm:vtm-android:0.29.0'
  compileOnly 'com.github.mapsforge.vtm:vtm-jts:0.29.0'
  compileOnly 'org.locationtech.jts:jts-core:1.20.0'
}

react {
  jsRootDir = file("../src/")
  libraryName = "MapsforgeVtmExtPathColorRampView"
  codegenJavaPackageName = "com.jhotadhari.reactnative.mapsforge.vtm.ext.pathcolorramp"
}
